# /etc/cloudflared/config.yml
#
# NOTE: `cloudflared service install` runs the daemon as root, and root reads
# /etc/cloudflared/config.yml — NOT ~/.cloudflared/config.yml. Editing the one
# in your home directory and restarting will appear to do nothing at all.
# After a service install, delete the home copy so there is only one truth.
#
# You already run a tunnel for Jellyfin. If you want to reuse that tunnel,
# just add the plate-api hostname to its ingress list — the entries are
# matched top to bottom and the catch-all must stay last.

tunnel: <your-tunnel-uuid>
credentials-file: /home/<you>/.cloudflared/<your-tunnel-uuid>.json

ingress:
  - hostname: plate-api.daksh.site
    service: http://127.0.0.1:8787

  # your existing entries, e.g.
  # - hostname: jelly.daksh.site
  #   service: http://127.0.0.1:8096

  - service: http_status:404
